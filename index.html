<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Predictive Road Safety Risk Mapping — Dashboard</title>
<style>
  :root{
    --maroon:#8C1D40;
    --maroon-dark:#6E1633;
    --asphalt:#21252B;
    --slate:#5A5F66;
    --grey:#B9AFB3;
    --line:#DDD7D9;
    --faint:#F6F4F3;
    --amber:#E39A2C;
    --paper:#FDFCFB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:Calibri,"Segoe UI",system-ui,sans-serif;
    color:var(--asphalt);
    background:var(--paper);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }

  /* ---- top bar ---- */
  header{
    background:var(--asphalt);
    color:#fff;
    padding:14px 24px;
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-shrink:0;
    border-bottom:3px solid var(--maroon);
  }
  header h1{
    font-family:Cambria,Georgia,serif;
    font-size:18px;
    font-weight:normal;
    margin:0;
    letter-spacing:0.2px;
  }
  header span{
    font-size:12.5px;
    color:#B9AFB3;
  }
  header .badge{
    margin-left:auto;
    font-size:11px;
    color:#D8C7CE;
    border:1px solid #4A4F57;
    border-radius:3px;
    padding:3px 8px;
  }
  #navToggle{
    display:none;
    background:none;border:1px solid #4A4F57;color:#fff;
    border-radius:3px;padding:5px 9px;font-size:14px;cursor:pointer;
  }

  /* ---- layout ---- */
  .shell{
    flex:1;
    display:flex;
    min-height:0;
  }

  nav{
    width:272px;
    flex-shrink:0;
    background:#fff;
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:18px 0 24px;
  }
  nav .group-label{
    font-size:11px;
    color:var(--slate);
    text-transform:uppercase;
    letter-spacing:0.6px;
    padding:4px 20px 8px;
  }
  nav .group + .group-label{ margin-top:14px; }
  nav button.item{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-left:3px solid transparent;
    padding:9px 19px 9px 17px;
    cursor:pointer;
    font-family:inherit;
  }
  nav button.item .t{
    display:block;
    font-size:13.5px;
    color:var(--asphalt);
    line-height:1.35;
  }
  nav button.item .d{
    display:block;
    font-size:11.5px;
    color:var(--slate);
    margin-top:2px;
    line-height:1.4;
  }
  nav button.item:hover{ background:var(--faint); }
  nav button.item.active{
    background:#FBF1F4;
    border-left-color:var(--maroon);
  }
  nav button.item.active .t{ color:var(--maroon-dark); font-weight:600; }

  main{
    flex:1;
    min-width:0;
    position:relative;
    background:#fff;
  }
  .frame-wrap{
    position:absolute;
    inset:0;
    display:none;
  }
  .frame-wrap.active{ display:block; }
  .frame-wrap iframe{
    width:100%;
    height:100%;
    border:none;
  }
  .loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--slate);
    font-size:13px;
  }

  /* mobile */
  @media (max-width:820px){
    #navToggle{ display:inline-block; }
    .shell{ position:relative; }
    nav{
      position:absolute;
      z-index:5;
      left:0; top:0; bottom:0;
      transform:translateX(-100%);
      transition:transform .18s ease;
      box-shadow:2px 0 10px rgba(0,0,0,0.15);
    }
    nav.open{ transform:translateX(0); }
  }
</style>
</head>
<body>

<header>
  <button id="navToggle" aria-label="Toggle menu">&#9776;</button>
  <h1>Predictive Road Safety Risk Mapping</h1>
  <span>NSW Road Crash Data 2020&ndash;2024 &middot; ICT605 Group Project</span>
  <span class="badge">Prototype dashboard</span>
</header>

<div class="shell">
  <nav id="sideNav">
    <div class="group-label">Where the risk is</div>
    <div class="group">
      <button class="item active" data-src="severity_map.html" data-title="Observed severity">
        <span class="t">Observed crash severity</span>
        <span class="d">Every reported crash, coloured by what actually happened</span>
      </button>
      <button class="item" data-src="10_crash_scatter.html" data-title="Predicted risk, by crash">
        <span class="t">Predicted risk, by crash</span>
        <span class="d">Same crashes, coloured by the model's predicted risk</span>
      </button>
      <button class="item" data-src="07_lga_risk_map.html" data-title="Predicted risk, by council area">
        <span class="t">Predicted risk, by council area</span>
        <span class="d">Mean predicted risk per LGA, for budget-level planning</span>
      </button>
      <button class="item" data-src="08_lga_ranking.html" data-title="Highest-risk council areas">
        <span class="t">Highest-risk council areas</span>
        <span class="d">Ranked shortlist of the highest predicted-risk LGAs</span>
      </button>
    </div>

    <div class="group-label">Why the model says so</div>
    <div class="group">
      <button class="item" data-src="interactive_risk_factors.html" data-title="Risk factors explorer">
        <span class="t">Risk factors explorer</span>
        <span class="d">Crash counts by weather, speed limit, lighting, urbanisation</span>
      </button>
      <button class="item" data-src="09_feature_importance.html" data-title="What the model relies on">
        <span class="t">What the model relies on</span>
        <span class="d">Which conditions actually move the prediction</span>
      </button>
      <button class="item" data-src="06_risk_band_validation.html" data-title="Do the risk bands hold up?">
        <span class="t">Do the risk bands hold up?</span>
        <span class="d">Predicted risk vs. what was actually observed, per band</span>
      </button>
    </div>

    <div class="group-label">Act on predictions</div>
    <div class="group">
      <button class="item" data-src="user_feedback.html" data-title="Review predictions">
        <span class="t">Review predictions</span>
        <span class="d">Accept or reject the model's call on each high-risk area</span>
      </button>
    </div>
  </nav>

  <main id="mainArea"></main>
</div>

<script>
(function(){
  var buttons = document.querySelectorAll('nav button.item');
  var mainArea = document.getElementById('mainArea');
  var loaded = {};

  function activate(btn){
    buttons.forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');

    var src = btn.getAttribute('data-src');

    document.querySelectorAll('.frame-wrap').forEach(function(w){
      w.classList.remove('active');
    });

    var wrap = document.getElementById('wrap-' + src);
    if(!wrap){
      wrap = document.createElement('div');
      wrap.className = 'frame-wrap';
      wrap.id = 'wrap-' + src;
      var loadingEl = document.createElement('div');
      loadingEl.className = 'loading';
      loadingEl.textContent = 'Loading \u2026';
      wrap.appendChild(loadingEl);
      mainArea.appendChild(wrap);
    }
    wrap.classList.add('active');

    if(!loaded[src]){
      var iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.title = btn.getAttribute('data-title') || src;
      iframe.addEventListener('load', function(){
        var lo = wrap.querySelector('.loading');
        if(lo) lo.remove();
      });
      wrap.appendChild(iframe);
      loaded[src] = true;
    }

    // collapse nav on mobile after selection
    document.getElementById('sideNav').classList.remove('open');
  }

  buttons.forEach(function(b){
    b.addEventListener('click', function(){ activate(b); });
  });

  document.getElementById('navToggle').addEventListener('click', function(){
    document.getElementById('sideNav').classList.toggle('open');
  });

  // load the first tab by default
  activate(buttons[0]);
})();
</script>

</body>
</html>
